services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:./data/dev.db"
      PROVENANCE_ENCRYPTION_KEY: "${PROVENANCE_ENCRYPTION_KEY:?Set PROVENANCE_ENCRYPTION_KEY in your .env file}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      HOME: /tmp/lazarus-home
      npm_config_cache: /tmp/npm-cache
      XDG_CACHE_HOME: /tmp/cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - lazarus_data:/app/backend/prisma/data
      - lazarus_backups:/app/backups
    restart: unless-stopped

volumes:
  lazarus_data:
  lazarus_backups:
