name: LAZARUS-X CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-verification:
    name: Backend Test Suite & DBMS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Typecheck Backend (tsc)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Backend Test Suites (Unit, Security, Merkle, Patent Claims)
        working-directory: backend
        run: npm test

      - name: Run DBMS Course Features Demonstration
        working-directory: backend
        run: npm run dbms:demo

  frontend-verification:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint Linter
        working-directory: frontend
        run: npx oxlint

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npx vitest run

      - name: Build Production Assets (Vite)
        working-directory: frontend
        run: npm run build

  docker-verification:
    name: Docker Container Build & Docker Hub Pipeline
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        run: |
          docker build -t divya23bce1042/lazarus-x:latest -t lazarus-x:ci-test .

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Container to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        run: |
          docker push divya23bce1042/lazarus-x:latest
